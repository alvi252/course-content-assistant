[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "course-content-assistant"
version = "1.0.0"
description = "Content ideas and scripts for course creators, built from their own course material, with every idea tied to a verified quote."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Aleks T." }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
    "openai>=1.40",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
anthropic = ["anthropic>=0.40"]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    "pypdf>=4.0",
    "anthropic>=0.40",
]

[project.scripts]
course-assistant = "course_assistant.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/course_assistant"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PTH", "S"]
ignore = [
    "RUF001", # typographic dashes/quotes in user-facing strings are intentional
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["course_assistant"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["rank_bm25.*", "pypdf.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "-q --doctest-modules"
